#!KAMAILIO
# Local development only: two browser clients on this Windows/WSL machine.
debug=2
log_stderror=no
children=2
disable_sctp=yes
tcp_accept_no_cl=yes
tcp_connection_lifetime=3605
tcp_connection_match=1
listen=tcp:127.0.0.1:8080
alias=localhost

loadmodule "db_postgres.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "nathelper.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"

# libpq reads the password from PGPASSFILE, outside the project.
modparam("auth_db", "db_url", "postgres://cathcy_sip@127.0.0.1:5432/cathcy_sip")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "use_domain", 1)
modparam("auth_db", "load_credentials", "")
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 1)
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("registrar", "max_contacts", 2)
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("rr", "enable_full_lr", 1)

request_route {
    force_rport();
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (is_method("CANCEL")) {
        if (t_check_trans()) t_relay();
        exit;
    }
    if (has_totag()) {
        if (loose_route()) {
            if ($du == "" && !handle_ruri_alias()) {
                sl_send_reply("400", "Bad Contact Alias");
                exit;
            }
            route(RELAY);
        }
        if (is_method("ACK")) {
            if (t_check_trans()) t_relay();
            exit;
        }
        sl_send_reply("404", "Dialog Not Found");
        exit;
    }
    if (is_method("ACK")) exit;
    if (!is_method("REGISTER|INVITE|MESSAGE|OPTIONS")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }
    if ($rd != "localhost" || $fd != "localhost") {
        sl_send_reply("403", "Local Domain Only");
        exit;
    }
    if (is_method("REGISTER")) {
        if ($td != "localhost") {
            sl_send_reply("403", "Local Domain Only");
            exit;
        }
        if (!www_authorize("localhost", "subscriber")) {
            www_challenge("localhost", "0");
            exit;
        }
        if ($au != $tU || $au != $fU) {
            sl_send_reply("403", "Identity Mismatch");
            exit;
        }
        consume_credentials();
        fix_nated_register();
        if (!save("location")) sl_reply_error();
        exit;
    }
    if (!proxy_authorize("localhost", "subscriber")) {
        proxy_challenge("localhost", "0");
        exit;
    }
    if ($au != $fU) {
        sl_send_reply("403", "Identity Mismatch");
        exit;
    }
    consume_credentials();
    if (is_method("OPTIONS") && $rU == $null) {
        sl_send_reply("200", "Keepalive");
        exit;
    }
    if (is_present_hf("Contact")) add_contact_alias();
    if (is_method("INVITE")) record_route();
    if (!lookup("location")) {
        sl_send_reply("480", "User Offline");
        exit;
    }
    route(RELAY);
}

route[RELAY] {
    t_on_reply("WS_REPLY");
    if (!t_relay()) sl_reply_error();
    exit;
}

onreply_route[WS_REPLY] {
    if (nat_uac_test("64") && is_present_hf("Contact")) add_contact_alias();
}

event_route[xhttp:request] {
    set_reply_close();
    set_reply_no_connect();
    if ($hu != "/ws" || $rm != "GET") {
        xhttp_reply("404", "Not Found", "text/plain", "Not Found");
        exit;
    }
    if ($hdr(Host) != "localhost:8080" && $hdr(Host) != "127.0.0.1:8080") {
        xhttp_reply("403", "Forbidden", "text/plain", "Invalid Host");
        exit;
    }
    if ($hdr(Origin) != "http://localhost:5173" && $hdr(Origin) != "http://127.0.0.1:5173") {
        xhttp_reply("403", "Forbidden", "text/plain", "Invalid Origin");
        exit;
    }
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "[Uu]pgrade") {
        ws_handle_handshake();
        exit;
    }
    xhttp_reply("400", "Bad Request", "text/plain", "WebSocket Required");
}
